include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

formatter:
  page_width: 120

linter:
  rules:
    public_member_api_docs: false
    lines_longer_than_80_chars: false # formatter is set to 120, like flutter-front
    # A `{Feature}Routing` port legitimately starts with a single method.
    # flutter-front disables this rule for the same reason.
    one_member_abstracts: false
