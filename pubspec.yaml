name: iho_tictactoe_workspace
description: Educational Tic Tac Toe app — mirrors the betclic flutter-front architecture, standalone.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

# Dart pub workspace: every member resolves against one shared lockfile.
# No `_data` member — the game has no I/O, so no repository, so no data layer.
workspace:
  - apps/iho_tictactoe
  - packages/features/tic_tac_toe/domain
  - packages/features/tic_tac_toe/presentation

dev_dependencies:
  melos: ^8.6.0
  very_good_analysis: ^10.3.0

# Flutter 3.44.4 pins `meta 1.18.0`, which caps `analyzer` below the version modern
# build_runner/riverpod_generator ask for. Same pins betclic flutter-front carries,
# for the same reason. Revisit when the Flutter SDK moves.
dependency_overrides:
  analyzer: 10.2.0
  build: 4.0.9
  build_runner: 2.15.3
  dart_style: 3.1.7
  flutter_riverpod: 3.2.1
  freezed: 3.2.5
  freezed_annotation: 3.1.0
  mockito: 5.6.4
  riverpod: 3.2.1
  riverpod_analyzer_utils: 1.0.0-dev.10
  riverpod_annotation: 4.0.2
  riverpod_generator: 4.0.3
  source_gen: 4.2.0
  source_helper: 1.3.10

melos:
  name: iho_tictactoe

  scripts:
    generate:
      description: Run build_runner in every package that has it.
      run: melos exec --depends-on=build_runner --concurrency=1 -- dart run build_runner build --delete-conflicting-outputs

    analyze:
      description: Analyze every package; infos are failures.
      run: melos exec -- dart analyze --fatal-infos .

    test:
      description: Run tests in every package that has a test/ folder.
      run: melos exec --dir-exists=test --concurrency=1 -- flutter test

    fix:
      description: Auto-fix lints and format at 120 columns.
      run: melos exec -- dart fix --apply && dart format --line-length 120 .
